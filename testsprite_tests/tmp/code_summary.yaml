version: "2"
type: frontend
tech_stack:
  - TypeScript
  - Next.js 15 (App Router)
  - React
  - Tailwind CSS v4
  - shadcn/ui
  - Clerk
  - tRPC
  - Prisma
  - PostgreSQL
  - Aurinko
  - Orama
  - OpenAI
  - Stripe
  - TipTap
  - Framer Motion
  - Jotai
routes:
  - path: /
    file: src/app/page.tsx
    auth_required: true
    description: Landing/onboarding page that prompts connecting a Google account, or redirects to /mail if accounts exist
  - path: /sign-in
    file: src/app/sign-in/[[...sign-in]]/page.tsx
    auth_required: false
    description: Clerk sign-in and sign-up page
  - path: /mail
    file: src/app/mail/page.tsx
    auth_required: true
    description: Main email client dashboard with sidebar, thread list, thread display, search, compose, and Ask AI
features:
  - name: User Authentication
    description: Sign in and sign up via Clerk; protected routes redirect unauthenticated users to /sign-in
    files:
      - src/app/sign-in/[[...sign-in]]/page.tsx
      - src/middleware.ts
      - src/app/layout.tsx
    entry_route: /sign-in
    user_interactions:
      - Open sign-in page
      - Enter credentials or use Clerk social/email flows
      - Complete authentication and land on home or mail
    api_calls: []
    auth_required: false
  - name: Link Google Email Account
    description: Connect a Google inbox via Aurinko OAuth from the onboarding home page
    files:
      - src/app/page.tsx
      - src/components/link-account-button.tsx
      - src/lib/aurinko.ts
      - src/app/api/aurinko/callback/route.ts
    entry_route: /
    user_interactions:
      - Click Connect Google Account button
      - Complete Aurinko/Google OAuth consent
      - Return to app after account linking and initial sync
    api_calls:
      - method: GET
        endpoint: /api/aurinko/callback
      - method: GET
        endpoint: /api/initial-sync
    auth_required: true
  - name: Mail Inbox Dashboard
    description: Three-pane mail UI with folder navigation, thread list, and thread reading pane
    files:
      - src/app/mail/page.tsx
      - src/app/mail/mail.tsx
      - src/app/mail/components/sidebar.tsx
      - src/app/mail/components/nav.tsx
      - src/app/mail/components/thread-display.tsx
      - src/app/mail/components/email-display.tsx
      - src/components/mail/thread-list-item.tsx
      - src/hooks/use-threads.ts
    entry_route: /mail
    user_interactions:
      - Switch between inbox folders or tabs
      - Browse and select email threads
      - Read email content in the thread pane
      - Toggle done/inbox state for threads
      - Collapse or expand sidebar navigation
    api_calls:
      - method: GET
        endpoint: /api/trpc/account.getThreads
      - method: GET
        endpoint: /api/trpc/account.getAccounts
      - method: GET
        endpoint: /api/trpc/account.getNumThreads
      - method: GET
        endpoint: /api/trpc/mail.getMyAccount
    auth_required: true
  - name: Account Switching
    description: Switch between linked email accounts in the mail UI
    files:
      - src/app/mail/components/account-switcher.tsx
      - src/app/mail/components/kbar/use-account-switching.tsx
    entry_route: /mail
    user_interactions:
      - Open account switcher
      - Select a different linked account
      - See threads refresh for the selected account
    api_calls:
      - method: GET
        endpoint: /api/trpc/account.getAccounts
    auth_required: true
  - name: Email Search
    description: Debounced full-text search across synced emails via Orama
    files:
      - src/app/mail/components/search/SearchBar.tsx
      - src/server/api/routers/search.ts
    entry_route: /mail
    user_interactions:
      - Focus search input
      - Type a search query
      - View search results
      - Clear search to return to normal thread list
    api_calls:
      - method: POST
        endpoint: /api/trpc/search.search
    auth_required: true
  - name: Ask AI Chat
    description: Chat with AI about the user's emails using RAG context from Orama embeddings
    files:
      - src/app/mail/components/AskAI.tsx
      - src/app/api/chat/route.ts
      - src/lib/rag-context.ts
    entry_route: /mail
    user_interactions:
      - Click a suggested prompt such as Any urgent emails?
      - Type a custom question in the chat input
      - Submit and read streamed AI responses
      - See daily limit toast when free quota is exceeded
    api_calls:
      - method: POST
        endpoint: /api/chat
    auth_required: true
  - name: Compose and Reply Email
    description: Compose new emails or reply to threads with TipTap editor and optional AI compose assistance
    files:
      - src/components/email-editor/compose-button.tsx
      - src/components/email-editor/reply-box.tsx
      - src/components/email-editor/email-editor.tsx
      - src/components/email-editor/ai-compose-button.tsx
      - src/components/email-editor/tag-input.tsx
      - src/components/email-editor/action.ts
    entry_route: /mail
    user_interactions:
      - Click compose to open a new email draft
      - Fill recipients subject and body
      - Use AI compose to draft content
      - Reply to an open thread
      - Send the email
    api_calls:
      - method: GET
        endpoint: /api/trpc/account.getReplyDetails
      - method: POST
        endpoint: /api/trpc/account.sendEmail
    auth_required: true
  - name: Subscription and Billing
    description: View subscription plan status and upgrade via Stripe
    files:
      - src/app/mail/components/subscription-plan-card.tsx
      - src/server/api/routers/billing.ts
      - src/lib/billing.ts
      - src/app/api/webhooks/stripe/route.ts
    entry_route: /mail
    user_interactions:
      - View current plan and usage limits
      - Start Stripe checkout to upgrade
    api_calls:
      - method: GET
        endpoint: /api/trpc/billing.getBillingSummary
      - method: POST
        endpoint: /api/trpc/billing.createCheckoutSession
    auth_required: true
  - name: Theme Toggle
    description: Switch between light and dark appearance themes
    files:
      - src/components/theme-toggle.tsx
      - src/components/theme-provider.tsx
    entry_route: /mail
    user_interactions:
      - Click theme toggle control
      - Observe UI theme change
    api_calls: []
    auth_required: true
known_limitations:
  - issue: App requires Clerk authentication and a linked Google account via Aurinko before most mail features work
    location: src/middleware.ts
    impact: Unauthenticated or unlinked users cannot exercise inbox search compose or Ask AI flows
  - issue: Dev server is single-threaded and may be less stable under concurrent TestSprite load than production mode
    location: package.json
    impact: TestSprite may limit to 15 high-priority tests while npm run dev is used
